# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
    # sphinx-argparse imports the CLI modules to reach their parsers, so dyco
    # and its runtime dependencies have to be present in the build environment.
    - method: pip
      path: .
